<section aria-labelledby="resume-heading">
  <h1 id="resume-heading">Resume</h1>
  <p class="name">Austin Chitmon</p>
  <p>Your download starts automatically. If it doesn’t appear, use the button below.</p>

  <button pButton
          type="button"
          class="download-button"
          [disabled]="facade.downloadingResume()"
          [attr.aria-busy]="facade.downloadingResume()"
          (click)="facade.downloadResume()">
    {{ facade.downloadingResume() ? 'Downloading…' : 'Download Resume' }}
  </button>

  @if (facade.resumeError(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }

  <a routerLink="/">Back to the site</a>
</section>
